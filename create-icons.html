<!DOCTYPE html>
<html>
<head>
  <title>Generate PWA Icons</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    button {
      padding: 15px 30px;
      font-size: 16px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 10px 0;
    }
    button:hover {
      background: #764ba2;
    }
    #preview {
      margin: 20px 0;
      display: flex;
      gap: 20px;
    }
    .icon-preview {
      border: 2px solid #ddd;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .icon-preview img {
      display: block;
      margin: 10px auto;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <h1>PWA Icon Generator</h1>
  <p>Click the button below to generate icon-192.png and icon-512.png files for the PWA.</p>
  
  <button onclick="generateIcons()">Generate Icons</button>
  
  <div id="preview"></div>
  
  <script>
    function generateIcons() {
      // Create 512x512 icon
      const canvas512 = document.createElement('canvas');
      canvas512.width = 512;
      canvas512.height = 512;
      const ctx512 = canvas512.getContext('2d');
      
      // Background gradient
      const gradient = ctx512.createLinearGradient(0, 0, 512, 512);
      gradient.addColorStop(0, '#667eea');
      gradient.addColorStop(1, '#764ba2');
      ctx512.fillStyle = gradient;
      ctx512.fillRect(0, 0, 512, 512);
      
      // Draw cross/plus icon
      ctx512.fillStyle = '#ffffff';
      ctx512.font = 'bold 300px Arial';
      ctx512.textAlign = 'center';
      ctx512.textBaseline = 'middle';
      ctx512.fillText('✝', 256, 256);
      
      // Convert to blob and download
      canvas512.toBlob((blob) => {
        const url512 = URL.createObjectURL(blob);
        const a512 = document.createElement('a');
        a512.href = url512;
        a512.download = 'icon-512.png';
        a512.click();
        
        // Create 192x192 version
        const canvas192 = document.createElement('canvas');
        canvas192.width = 192;
        canvas192.height = 192;
        const ctx192 = canvas192.getContext('2d');
        ctx192.drawImage(canvas512, 0, 0, 192, 192);
        
        canvas192.toBlob((blob192) => {
          const url192 = URL.createObjectURL(blob192);
          const a192 = document.createElement('a');
          a192.href = url192;
          a192.download = 'icon-192.png';
          a192.click();
          
          // Show preview
          const preview = document.getElementById('preview');
          preview.innerHTML = `
            <div class="icon-preview">
              <h3>192x192</h3>
              <img src="${url192}" alt="Icon 192">
            </div>
            <div class="icon-preview">
              <h3>512x512</h3>
              <img src="${url512}" alt="Icon 512">
            </div>
          `;
          
          alert('Icons generated and downloaded! Place them in the Readingplan directory.');
        });
      }, 'image/png');
    }
  </script>
</body>
</html>
